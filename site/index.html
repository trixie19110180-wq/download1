<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Download the Scratch project file."
    />
    <meta name="theme-color" content="#7857ff" />
    <title>Scratch Project Download</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="download-card" aria-labelledby="page-title">
        <div class="file-icon" aria-hidden="true">
          <span>SB3</span>
        </div>

        <p class="eyebrow">Scratch project</p>
        <h1 id="page-title">Ready to download</h1>
        <p class="intro">
          Get the project file and open it in Scratch 3.
        </p>

        <div class="file-details">
          <div>
            <p class="file-name">스크래치 프로젝트 (2).sb3</p>
            <p class="file-meta">394 KB · SB3 file</p>
          </div>
          <span class="status" aria-label="File status: ready">Ready</span>
        </div>

        <a
          class="download-button"
          href="./scratch-project.sb3"
          download="스크래치 프로젝트 (2).sb3"
          aria-label="Download the Scratch project file"
        >
          <span class="arrow" aria-hidden="true">↓</span>
          Download
        </a>

        <p class="help-text">The download should begin immediately.</p>
      </section>
    </main>
  </body>
</html>
