services:
  - type: web
    name: download1
    runtime: static
    buildCommand: echo "Static site ready"
    staticPublishPath: ./site
    autoDeployTrigger: commit
    headers:
      - path: /scratch-project.sb3
        name: Content-Disposition
        value: attachment; filename="scratch-project.sb3"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
